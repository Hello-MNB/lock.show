name: verify

# T-96 Phase-5 regression harness: run the FULL 19-check `npm run verify` chain
# plus the website-next type-check + static-export build on every PR and every
# push to main. The website-next build runs FIRST because test:seo and
# test:sitenav assert against the built export in website-next/out.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the deploy target (website-next engines: 22.x); 20 guards the
        # oldest still-supported LTS for the root toolchain.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website-next/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install website-next dependencies
        working-directory: website-next
        run: npm ci

      - name: Type-check website-next
        working-directory: website-next
        run: npx tsc --noEmit

      - name: Build website-next static export (out/ consumed by test:seo + test:sitenav)
        working-directory: website-next
        run: npx next build

      # test:fit (check 19/19) drives a real headless Chromium. Install the
      # browser so CI runs the FULL chain — without this step test-fit.mjs
      # would hard-fail on launch (the playwright npm package is present, only
      # the browser binary is missing). If this install ever becomes a burden,
      # remove it AND document that CI runs a reduced 18-check chain — do not
      # let test:fit silently no-op.
      - name: Install Playwright Chromium (for test:fit)
        run: npx playwright install --with-deps chromium

      - name: Run full verify chain (19 checks)
        run: npm run verify
