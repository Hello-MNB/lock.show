  >LOCK SHOW</text>

  <!-- Tagline -->


  <!-- Main headline -->
  <text
    x="113"
    y="340"
    font-family="'Rubik', sans-serif"
    font-weight="600"
    font-size="44"
    fill="#0a0b0f"
