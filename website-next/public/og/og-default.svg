  <text
    x="113"
    y="398"
    font-family="'Rubik', sans-serif"
    font-weight="600"
    font-size="44"
    fill="#0a0b0f"
  >Permissioned PASSPORT.</text>

  <!-- Sub copy -->
  <text
    x="113"
    y="468"
    font-family="'Rubik', sans-serif"
    font-weight="400"
    font-size="24"
    fill="#5c655e"
  >Professional evidence, shared with context.</text>

  <!-- Domain -->
  <text
    x="113"
    y="548"
    font-family="'Space Mono', monospace"
    font-weight="700"
    font-size="18"
    fill="#0a0b0f"
