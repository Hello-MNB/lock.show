  >lock.show</text>

  <!-- Bounded public principles -->
  <rect x="810" y="180" width="300" height="1" fill="#d9d8d2"/>
  <text x="810" y="230" font-family="'Space Mono', monospace" font-weight="700" font-size="13" fill="#5c6e12" letter-spacing="1.5">PRIVATE BY DEFAULT</text>
  <text x="810" y="290" font-family="'Space Mono', monospace" font-weight="700" font-size="13" fill="#5c6e12" letter-spacing="1.5">SHARED BY PERMISSION</text>
  <text x="810" y="350" font-family="'Space Mono', monospace" font-weight="700" font-size="13" fill="#5c6e12" letter-spacing="1.5">NO SCORE · NO RANKING</text>
  <text x="810" y="410" font-family="'Space Mono', monospace" font-weight="700" font-size="13" fill="#5c6e12" letter-spacing="1.5">NO BOOKING GUARANTEE</text>
  <rect x="810" y="458" width="300" height="1" fill="#d9d8d2"/>

  <!-- Bottom border -->
  <rect x="0" y="624" width="1200" height="6" fill="#d9d8d2"/>
